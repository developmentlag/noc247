<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 328" width="640" height="328" role="img">
  <title>Night-shift timeline from the evening handover to the morning report</title>
  <rect width="640" height="400" rx="28" fill="#0B2545"/>
  <circle cx="520" cy="78" r="28" fill="#1F6FEB" opacity="0.9"/>
  <circle cx="532" cy="70" r="22" fill="#0B2545"/>
  <g fill="#8DA9C4">
    <circle cx="86" cy="64" r="1.4"/><circle cx="110" cy="48" r="1.2"/><circle cx="140" cy="72" r="1.3"/>
    <circle cx="180" cy="42" r="1.1"/><circle cx="230" cy="66" r="1.4"/><circle cx="280" cy="50" r="1.2"/>
    <circle cx="340" cy="40" r="1.3"/><circle cx="390" cy="68" r="1.1"/>
  </g>
  <text x="40" y="58" fill="#8DA9C4" font-family="Inter, Noto Sans, sans-serif" font-size="13" font-weight="600" letter-spacing="1.6">NIGHT SHIFT</text>
  <text x="40" y="118" fill="#ffffff" font-family="Inter, Noto Sans, sans-serif" font-size="28" font-weight="700">18:00 handover to 08:00 desk</text>
  <text x="40" y="148" fill="#B3C7E6" font-family="Inter, Noto Sans, sans-serif" font-size="15">The hours the day team is not in the chair</text>
  <line x1="48" y1="250" x2="592" y2="250" stroke="#1F6FEB" stroke-width="3" stroke-linecap="round"/>
  <g font-family="Inter, Noto Sans, sans-serif" text-anchor="middle">
    <circle cx="80" cy="250" r="8" fill="#1F6FEB"/>
    <text x="80" y="286" fill="#ffffff" font-size="14" font-weight="700">18:00</text>
    <text x="80" y="306" fill="#8DA9C4" font-size="12">Handover</text>
    <circle cx="250" cy="250" r="8" fill="#8DA9C4"/>
    <text x="250" y="286" fill="#ffffff" font-size="14" font-weight="700">02:14</text>
    <text x="250" y="306" fill="#8DA9C4" font-size="12">Backup alert</text>
    <circle cx="420" cy="250" r="8" fill="#8DA9C4"/>
    <text x="420" y="286" fill="#ffffff" font-size="14" font-weight="700">07:30</text>
    <text x="420" y="306" fill="#8DA9C4" font-size="12">Report</text>
    <circle cx="560" cy="250" r="8" fill="#ffffff"/>
    <text x="560" y="286" fill="#ffffff" font-size="14" font-weight="700">08:00</text>
    <text x="560" y="306" fill="#8DA9C4" font-size="12">Day desk</text>
  </g>
</svg>
