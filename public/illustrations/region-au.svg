<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img">
  <title>Stylised map of Australia with Sydney and Perth marked</title>
  <rect width="640" height="360" rx="28" fill="#0B2545"/>
  <text x="36" y="48" fill="#8DA9C4" font-family="Inter, Noto Sans, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4">AUSTRALIA</text>
  <path d="M120 150 l70-28 90-10 80 16 70 24 40 30-16 36-50 22-80 8-90-6-70 10-40-24-20-36z" fill="#13315C" stroke="#1F6FEB" stroke-width="2"/>
  <circle cx="168" cy="196" r="7" fill="#ffffff"/>
  <circle cx="430" cy="188" r="7" fill="#1F6FEB"/>
  <text x="150" y="230" fill="#B3C7E6" font-family="Inter, Noto Sans, sans-serif" font-size="13">Perth</text>
  <text x="412" y="222" fill="#ffffff" font-family="Inter, Noto Sans, sans-serif" font-size="13" font-weight="700">Sydney</text>
  <text x="36" y="300" fill="#ffffff" font-family="Inter, Noto Sans, sans-serif" font-size="16" font-weight="700">AEST and AWST</text>
  <text x="36" y="328" fill="#8DA9C4" font-family="Inter, Noto Sans, sans-serif" font-size="13">Illustrative region header. Not a client location.</text>
</svg>
