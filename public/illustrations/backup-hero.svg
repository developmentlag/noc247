<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img">
  <title>Overnight backup path from a failed job alert to the morning report</title>
  <rect width="640" height="360" rx="28" fill="#0B2545"/>
  <text x="36" y="52" fill="#8DA9C4" font-family="Inter, Noto Sans, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4">OVERNIGHT BACKUP</text>
  <text x="36" y="90" fill="#ffffff" font-family="Inter, Noto Sans, sans-serif" font-size="26" font-weight="700">Alert, then a decision</text>
  <g font-family="Inter, Noto Sans, sans-serif">
    <rect x="36" y="124" width="150" height="78" rx="16" fill="#13315C"/>
    <text x="52" y="156" fill="#8DA9C4" font-size="12">1</text>
    <text x="52" y="178" fill="#ffffff" font-size="16" font-weight="700">Alert</text>
    <rect x="210" y="124" width="180" height="78" rx="16" fill="#1F6FEB"/>
    <text x="226" y="156" fill="#E7F0FF" font-size="12">3</text>
    <text x="226" y="178" fill="#ffffff" font-size="16" font-weight="700">Five-way triage</text>
    <rect x="414" y="124" width="190" height="78" rx="16" fill="#13315C" stroke="#ffffff" stroke-dasharray="4 3"/>
    <text x="430" y="156" fill="#8DA9C4" font-size="12">Stop</text>
    <text x="430" y="178" fill="#ffffff" font-size="16" font-weight="700">Ransomware · P1</text>
    <rect x="36" y="230" width="270" height="78" rx="16" fill="#13315C"/>
    <text x="52" y="262" fill="#8DA9C4" font-size="12">4–6</text>
    <text x="52" y="284" fill="#ffffff" font-size="16" font-weight="700">Retry, fix, verify</text>
    <rect x="330" y="230" width="274" height="78" rx="16" fill="#ffffff"/>
    <text x="346" y="262" fill="#1F6FEB" font-size="12">8</text>
    <text x="346" y="284" fill="#0B2545" font-size="16" font-weight="700">Morning report</text>
  </g>
</svg>
